<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>六边形缩圈赛车</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b1120;
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
    color: #eef3fb; user-select: none; }
  #game { position: fixed; inset: 0; display: block; }
  /* 渐晕：让视线聚焦中心 */
  .vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(2, 6, 16, 0.55) 100%); }

  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; pointer-events: none; }

  /* ---- 菜单 ---- */
  #menu { pointer-events: auto; background: rgba(7, 11, 20, 0.85); backdrop-filter: blur(10px); z-index: 20;
    overflow-y: auto; max-height: 100vh; padding: 16px 20px 20px; }
  #menu h1 {
    margin: 0 0 6px; font-size: 28px; letter-spacing: 1px;
    background: linear-gradient(135deg, #6fd3ff, #4d7bff 45%, #ff6fd8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(90, 140, 255, 0.35);
  }
  #menu .tagline { margin: 0 0 10px; font-size: 12px; line-height: 1.6; color: rgba(238, 243, 251, 0.6); }
  .btn {
    pointer-events: auto; cursor: pointer; border: none; border-radius: 12px;
    padding: 12px 36px; font-size: 18px; font-weight: 700; letter-spacing: 1px;
    color: #0b1220; background: linear-gradient(135deg, #7fe0ff, #4d7bff);
    box-shadow: 0 6px 22px rgba(70, 130, 255, 0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 10px 32px rgba(70, 130, 255, 0.6); }
  .btn:active { transform: translateY(0) scale(0.98); }
  #menu .keys { margin-top: 10px; font-size: 11px; color: rgba(238, 243, 251, 0.45); letter-spacing: 1px; }

  /* 折叠面板（商店 / 挑战） */
  details.fold { margin: 6px 0; text-align: left; background: rgba(20, 30, 50, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; padding: 8px 12px; min-width: 440px; }
  details.fold summary {
    cursor: pointer; font-size: 14px; font-weight: 700; color: #eef3fb;
    padding: 2px 0; user-select: none; list-style: none; display: flex; align-items: center; gap: 8px;
  }
  details.fold summary::-webkit-details-marker { display: none; }
  details.fold summary::before { content: '▸ '; color: #7fd4ff; }
  details.fold[open] summary::before { content: '▾ '; }
  details.fold summary .fold-wallet { margin-left: auto; color: #ffd23e; font-size: 13px; }
  details.fold[open] .fold-body { margin-top: 8px; }
  details.fold .fold-body .shop { margin: 0; min-width: 0; }
  details.fold .fold-body .ch-btn { margin: 0; }

  /* ---- 商店 ---- */
  .shop { margin: 4px 0 22px; background: rgba(20, 30, 50, 0.55); border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px; padding: 12px 14px; min-width: 420px; }
  .shop-head { font-size: 15px; margin-bottom: 10px; color: rgba(238, 243, 251, 0.85); }
  .shop-head b { color: #ffd23e; font-size: 17px; }
  .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .up-btn {
    pointer-events: auto; cursor: pointer; text-align: left; color: #eef3fb;
    background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.5;
    display: flex; flex-direction: column; gap: 2px; transition: background 0.15s, transform 0.1s;
  }
  .up-btn:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-1px); }
  .up-btn:active { transform: scale(0.97); }
  .up-btn .up-desc { font-size: 11px; color: rgba(238, 243, 251, 0.6); }
  .up-btn .up-lv { font-size: 11px; color: rgba(238, 243, 251, 0.75); }
  .up-btn .up-cost { font-size: 12px; font-weight: 700; color: #ffd23e; }
  .up-btn.maxed { opacity: 0.55; cursor: default; }
  .up-btn.afford { border-color: #ffd23e88; box-shadow: 0 0 12px rgba(255, 210, 62, 0.25); }

  /* ---- 难度 / 地图选项卡 ---- */
  .tabs { margin: 4px 0 8px; background: rgba(20, 30, 50, 0.5); border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px; padding: 8px 10px; min-width: 440px; }
  .tab-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; flex-wrap: wrap; }
  .tab-label { font-size: 12px; color: rgba(238, 243, 251, 0.6); min-width: 42px; text-align: left; }
  .tab-btn {
    pointer-events: auto; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.06); color: rgba(238, 243, 251, 0.8);
    border-radius: 8px; padding: 4px 10px; font-size: 13px; transition: all 0.12s;
  }
  .tab-btn:hover { background: rgba(255, 255, 255, 0.14); }
  .tab-btn.sel { background: linear-gradient(135deg, #7fe0ff, #4d7bff); color: #0b1220; font-weight: 700;
    border-color: transparent; box-shadow: 0 0 12px rgba(70, 130, 255, 0.45); }
  .start-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn2 { background: linear-gradient(135deg, #ffb36b, #ff7b3d); box-shadow: 0 8px 30px rgba(255, 123, 61, 0.4); }
  .btn2:hover { box-shadow: 0 12px 40px rgba(255, 123, 61, 0.55); }
  .btnFt { background: linear-gradient(135deg, #8fe88a, #37b45f); box-shadow: 0 8px 30px rgba(55, 180, 95, 0.4); }
  .btnFt:hover { box-shadow: 0 12px 40px rgba(55, 180, 95, 0.55); }
  .btnInf { background: linear-gradient(135deg, #e08cff, #8d4dff); box-shadow: 0 8px 30px rgba(140, 80, 255, 0.4); font-size: 16px; padding: 12px 26px; }
  .btnInf:hover { box-shadow: 0 12px 40px rgba(140, 80, 255, 0.55); }
  .btnLava { background: linear-gradient(135deg, #ff9a3d, #ff3d3d); box-shadow: 0 8px 30px rgba(255, 90, 60, 0.4); font-size: 16px; padding: 12px 26px; }
  .btnLava:hover { box-shadow: 0 12px 40px rgba(255, 90, 60, 0.55); }
  .btnCp { background: linear-gradient(135deg, #5cf0c8, #2fa88a); box-shadow: 0 8px 30px rgba(60, 200, 170, 0.4); font-size: 16px; padding: 12px 26px; }
  .btnCp:hover { box-shadow: 0 12px 40px rgba(60, 200, 170, 0.55); }

  /* ---- 挑战按钮 ---- */
  .ch-btn { line-height: 1.4; padding: 6px 12px; }
  .ch-reward { font-size: 11px; color: #ffd23e; font-weight: 700; }

  /* ---- 地图编辑器 ---- */
  #editor { z-index: 25; background: rgba(7, 11, 20, 0.92); backdrop-filter: blur(10px); display: none; }
  #editor h2 { margin: 0 0 12px; font-size: 26px; }
  #editCanvas { border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; cursor: crosshair; background: #0b1120; }

  /* ---- HUD ---- */
  #hud { position: fixed; left: 16px; top: 16px; z-index: 10; }
  .panel {
    background: rgba(10, 16, 28, 0.72); border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px; padding: 12px 16px; font-size: 14px; line-height: 1.9;
    backdrop-filter: blur(6px); min-width: 170px;
  }
  .panel .row { display: flex; justify-content: space-between; gap: 14px; }
  .panel .label { color: rgba(238, 243, 251, 0.65); }
  .panel .val { font-weight: 700; }
  .bar { height: 8px; background: rgba(255, 255, 255, 0.14); border-radius: 5px; margin: 6px 0 4px; overflow: hidden; }
  #ringBarFill { height: 100%; width: 100%; border-radius: 5px;
    background: linear-gradient(90deg, #ffd24d, #ff5d5d); transition: width 0.1s linear; }
  .mini {
    pointer-events: auto; cursor: pointer; margin-top: 8px; width: 100%;
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.18);
    color: #eef3fb; border-radius: 8px; padding: 4px 0; font-size: 13px;
  }
  .mini:hover { background: rgba(255, 255, 255, 0.2); }

  /* ---- 小地图 ---- */
  #minimapWrap { position: fixed; right: 16px; top: 16px; z-index: 10;
    background: rgba(10, 16, 28, 0.7); border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 12px; padding: 6px; backdrop-filter: blur(6px); }
  #minimap { display: block; border-radius: 8px; }

  /* ---- 提示 ---- */
  #controlsHint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    font-size: 12px; color: rgba(238, 243, 251, 0.72); background: rgba(0, 0, 0, 0.35);
    padding: 8px 16px; border-radius: 20px; letter-spacing: 1px; }

  /* ---- 横幅 / 倒计时 ---- */
  #banner { position: fixed; top: 14%; left: 0; right: 0; text-align: center; z-index: 12;
    font-size: 32px; font-weight: 800; letter-spacing: 3px; display: none;
    text-shadow: 0 3px 16px rgba(0, 0, 0, 0.65); color: #fff; pointer-events: none; }
  #countdown { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 130px; font-weight: 900; z-index: 15; pointer-events: none;
    color: #fff; text-shadow: 0 0 46px rgba(90, 170, 255, 0.95); }

  /* ---- 结算 ---- */
  #result { z-index: 30; pointer-events: auto; background: rgba(7, 11, 20, 0.8); backdrop-filter: blur(10px); display: none; }
  #result h2 { margin: 0 0 10px; font-size: 40px; letter-spacing: 2px; }
  #result p { margin: 0 0 16px; font-size: 15px; color: rgba(238, 243, 251, 0.8); }
  #resultEarn { color: #ffd23e !important; font-weight: 700; font-size: 17px !important; }

  /* ---- 观战标签 ---- */
  #spectateLabel { position: fixed; top: 14%; left: 0; right: 0; text-align: center; z-index: 11;
    font-size: 16px; color: rgba(238, 243, 251, 0.85); text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    pointer-events: none; }

  /* ---- 触屏虚拟按键 ---- */
  #touchUI { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
  .touch-left { position: fixed; left: 14px; bottom: 20px; display: flex; gap: 12px; pointer-events: auto; }
  .touch-right { position: fixed; right: 14px; bottom: 20px; display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
  .tbtn {
    width: 72px; height: 72px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.45);
    background: rgba(255, 255, 255, 0.18); color: #fff; font-size: 26px; font-weight: 700;
    backdrop-filter: blur(4px); touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .tbtn:active { background: rgba(255, 255, 255, 0.4); }
  .tjump { width: 84px; height: 84px; font-size: 24px; background: rgba(90, 170, 255, 0.4); }
  .tdash { width: 60px; height: 60px; font-size: 18px; background: rgba(255, 140, 60, 0.45); }

  /* ================= 小窗模式 ================= */
  .mini-mode #game {
    position: fixed; inset: auto;
    top: var(--mw-y, 14px); left: var(--mw-x, 14px);
    width: var(--mw-w, 380px); height: var(--mw-h, 254px);
    border: 2px solid rgba(255, 255, 255, 0.28); border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.65); z-index: 90; cursor: grab;
  }
  .mini-mode #game.dragging { cursor: grabbing; }
  .mini-mode #hud, .mini-mode #minimapWrap, .mini-mode #controlsHint, .mini-mode .vignette { display: none !important; }
  .mini-mode #banner {
    position: fixed; left: var(--mw-x, 14px); width: var(--mw-w, 380px);
    top: calc(var(--mw-y, 14px) + 24px); font-size: 17px; letter-spacing: 1px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
  }
  .mini-mode #countdown {
    position: fixed; left: var(--mw-x, 14px); top: var(--mw-y, 14px);
    width: var(--mw-w, 380px); height: var(--mw-h, 254px);
    font-size: 64px; z-index: 95;
  }
  .mini-mode #spectateLabel {
    position: fixed; left: var(--mw-x, 14px); top: calc(var(--mw-y, 14px) + var(--mw-h, 254px) - 26px);
    width: var(--mw-w, 380px); font-size: 12px;
  }
  .mini-mode #result { padding: 18px; font-size: 13px; }
  .mini-mode #result {
    position: fixed; inset: auto;
    top: var(--mw-y, 14px); left: var(--mw-x, 14px);
    width: var(--mw-w, 380px); height: var(--mw-h, 254px);
    border-radius: 14px;
  }
  .mini-mode #result h2 { font-size: 22px; }
  .mini-mode #result p { font-size: 12px; margin: 0 0 10px; }
  .mini-mode #result .btn { font-size: 14px; padding: 9px 22px; }
  #miniHud {
    position: fixed; display: none; z-index: 96; pointer-events: none;
    top: calc(var(--mw-y, 14px) + 6px); left: calc(var(--mw-x, 14px) + 10px);
    font-size: 11px; color: #fff; background: rgba(0, 0, 0, 0.45);
    border-radius: 8px; padding: 3px 8px; letter-spacing: 0.5px; line-height: 1.5;
  }
  #miniBtns {
    position: fixed; display: none; z-index: 97;
    top: calc(var(--mw-y, 14px) + 4px); right: calc(100vw - var(--mw-x, 14px) - var(--mw-w, 380px) + 6px);
    display: none; gap: 6px;
  }
  #miniBtns button {
    pointer-events: auto; cursor: pointer; border: none; border-radius: 8px;
    background: rgba(255, 255, 255, 0.22); color: #fff; font-size: 13px;
    padding: 3px 9px; backdrop-filter: blur(4px);
  }
  #miniBtns button:hover { background: rgba(255, 255, 255, 0.4); }
  /* 小窗触屏按钮：缩小并收进小窗底部 */
  .mini-mode .touch-left { left: calc(var(--mw-x, 14px) + 6px); bottom: calc(100vh - var(--mw-y, 14px) - var(--mw-h, 254px) + 4px); }
  .mini-mode .touch-right { right: calc(100vw - var(--mw-x, 14px) - var(--mw-w, 380px) + 6px); bottom: calc(100vh - var(--mw-y, 14px) - var(--mw-h, 254px) + 4px); }
  .mini-mode .tbtn { width: 44px; height: 44px; font-size: 16px; }
  .mini-mode .tjump { width: 54px; height: 54px; font-size: 14px; }
  .mini-mode .tdash { width: 38px; height: 38px; font-size: 12px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="vignette"></div>

<div id="hud" style="display:none">
  <div class="panel">
    <div class="row"><span class="label">🏁 存活</span><span class="val" id="alive">8 / 8</span></div>
    <div class="row" id="ringRow"><span class="label">🛡 当前外圈</span><span class="val" id="ringNum">12</span></div>
    <div class="bar" id="ringBar"><div id="ringBarFill"></div></div>
    <div class="row" id="ringTimeRow"><span class="label">⏱ 下次缩圈</span><span class="val" id="ringTime">10.0s</span></div>
    <div class="row" id="ftRow" style="display:none"><span class="label" id="ftTimer">⏱ 90s</span><span class="val" id="ftMy">0球</span><span class="val" id="ftLead">-</span></div>
    <div class="row"><span class="label">💰 金币</span><span class="val" id="coinCount">0</span></div>
    <div class="row" id="itemRow" style="display:none"><span class="label">🎁 道具</span><span class="val" id="itemVal"></span></div>
    <div class="row" id="objRow" style="display:none"><span class="label" id="objLabel">🎯</span><span class="val" id="objVal"></span></div>
    <div style="display:flex;gap:6px">
      <button class="mini" id="btnMini">🗔 小窗</button>
      <button class="mini" id="btnMute">🔊</button>
    </div>
  </div>
</div>
<div id="spectateLabel" style="display:none">👁</div>

<div id="minimapWrap" style="display:none"><canvas id="minimap" width="150" height="150"></canvas></div>

<div id="controlsHint">WASD / 方向键 驾驶 · 空格 跳跃 · E 冲撞 · Shift 手刹 · M 静音</div>
<div id="banner"></div>
<div id="countdown"></div>
<!-- 小窗模式：迷你 HUD + 控制按钮 -->
<div id="miniHud"></div>
<div id="miniBtns">
  <button id="btnMiniBig">⛶ 大屏</button>
  <button id="btnMiniClose">✕</button>
</div>

<!-- 手机触屏虚拟按键 -->
<div id="touchUI" style="display:none">
  <div class="touch-left">
    <button class="tbtn" id="tl">◀</button>
    <button class="tbtn" id="tr">▶</button>
  </div>
  <div class="touch-right">
    <button class="tbtn tjump" id="tJump">跳</button>
    <button class="tbtn tdash" id="tDash">冲</button>
  </div>
</div>

<div id="menu" class="overlay">
  <h1>⚡ 六边形缩圈赛车</h1>
  <p class="tagline">碾过的格子必掉、最外层缩圈、掉下去即淘汰 —— 坚持到最后的人就是冠军！</p>

  <div class="start-row">
    <button class="btn" id="btnStart">🚀 开始游戏</button>
  </div>

  <!-- 设置：难度 / AI 数量 / 地图 -->
  <div class="tabs">
    <div class="tab-row">
      <span class="tab-label">🎚 难度</span>
      <button class="tab-btn" id="diff-easy">简单</button>
      <button class="tab-btn" id="diff-normal">普通</button>
      <button class="tab-btn" id="diff-hard">困难</button>
    </div>
    <div class="tab-row" id="aiRow">
      <span class="tab-label">🤖 AI数量</span>
      <button class="tab-btn" id="ai-minus">－</button>
      <button class="tab-btn stepper-val" id="aiCountVal">7</button>
      <button class="tab-btn" id="ai-plus">＋</button>
    </div>
    <div class="tab-row" id="mapRow">
      <span class="tab-label">🗺 地图</span>
      <button class="tab-btn" id="map-arena">标准竞技场</button>
      <button class="tab-btn" id="map-small">小盘快战</button>
      <button class="tab-btn" id="map-mini">迷你竞技场</button>
      <button class="tab-btn" id="map-mine">雷区</button>
      <button class="tab-btn" id="map-canyon">裂谷</button>
      <button class="tab-btn" id="map-gadget">⚡ 机关场</button>
    </div>
  </div>

  <div class="keys">WASD / 方向键 驾驶 · 空格 跳 · E 撞 · Shift 手刹 · M 静音 · 手机触屏自动显示按键</div>
</div>

<div id="result" class="overlay">
  <h2 id="resultTitle"></h2>
  <p id="resultSub"></p>
  <p id="resultEarn"></p>
  <button class="btn" id="btnRestart">🔄 再来一局</button>
</div>

<script src="js/grid.js"></script>
<script src="js/car.js"></script>
<script src="js/ai.js"></script>
<script src="js/draw.js"></script>
<script src="js/audio.js"></script>
<script src="js/save.js"></script>
<script src="js/game.js"></script>
</body>
</html>
